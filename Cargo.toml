[package]
name = "f1-lap-sim"
version = "0.1.0"
edition = "2024"
description = "Minimum-time optimal-control lap simulator for Formula 1 circuits, validated against real 2018 pole times"
license = "MIT"
repository = "https://github.com/alicjakr/f1-lap-sim"
readme = "README.md"
keywords = ["formula1", "optimal-control", "simulation", "ipopt", "motorsport"]
categories = ["science", "simulation"]

[lib]
name = "f1_lap_sim"
path = "src/lib.rs"

[dependencies]
ipopt = "0.6"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["fs"] }
