[package]
name = "f1-lap-sim"
version = "0.1.0"
edition = "2024"

[lib]
name = "f1_lap_sim"
path = "src/lib.rs"

[dependencies]
ipopt = "0.6"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["fs"] }
