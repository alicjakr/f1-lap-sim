networks:
  prometheus:
    name: prometheus
    driver: bridge
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9091:9090"
    command:
      - '--config.file=/prometheus-3.16.0.darwin-arm64/prometheus.yml'
      - '--storage.tsdb.path=/prometheus-3.16.0.darwin-arm64/data' # path where Prometheus stores its data
    volumes:
      - ./prometheus.yml:/prometheus-3.16.0.darwin-arm64/prometheus.yml
      - ./data:/prometheus-3.16.0.darwin-arm64/data
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_BASIC_ENABLED=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
  grafana-dashboards:
    image: alpine:latest
    depends_on:
      - grafana
    volumes:
      - ./grafana-data:/grafana
    command: >
      /bin/sh -c "
        apk add --no-cache curl
        echo 'waiting for grafana'
        sleep 5s
        cd /grafana
        curl --request POST http://host.docker.internal:3000/api/datasources --header 'Content-Type: application/json' -d @datasources.json
        curl --request POST http://host.docker.internal:3000/api/dashboards/db --header 'Content-Type: application/json' -d @dashboard.json"
    networks:
      - prometheus