<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Lap Sim</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
</head>
<body>
<header>
  <h1><span class="accent-bar"></span>F1 Racing Line Solver<span class="accent-bar"></span></h1>
  <p class="subtitle">2018 season &middot; live racing-line optimizer</p>
  <div class="controls">
    <label>Track <select id="track"></select></label>
    <label>Spacing (m) <input id="spacing" type="number" value="25" min="5" max="100" step="5"></label>
    <button id="solve">Solve</button>
    <span id="spinner" class="spinner" hidden></span>
    <span id="status"></span>
  </div>
</header>
<main>
  <section id="track-panel">
    <svg id="track-view"></svg>
  </section>
  <section id="side-panel">
    <div id="stats"></div>
    <svg id="speed-trace"></svg>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
